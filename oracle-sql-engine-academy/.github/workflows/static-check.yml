name: Static checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify entrypoint
        run: test -s index.html
      - name: Check for merge markers
        run: '! grep -nE "^(<<<<<<<|=======|>>>>>>>)" index.html'
