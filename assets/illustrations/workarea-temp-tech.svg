<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">PGA Work Area y flujo TEMP educativo</title>
  <desc id="desc">Ilustración tecnológica de una operación SQL que reserva una workarea conceptual, procesa datos y utiliza TEMP únicamente cuando el escenario educativo declara fases temporales.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171412"/><stop offset="1" stop-color="#31221e"/></linearGradient>
    <linearGradient id="workarea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e26852"/><stop offset="1" stop-color="#8d3028"/></linearGradient>
    <linearGradient id="temp" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9a441"/><stop offset="1" stop-color="#81511e"/></linearGradient>
    <linearGradient id="sql" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4e9eb7"/><stop offset="1" stop-color="#204c68"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="720" rx="36" fill="url(#background)"/>
  <g opacity=".22" stroke="#f4b8ad" stroke-width="1"><path d="M40 110H280M55 620H298M995 118H1230M962 620H1225"/><path d="M90 72V648M1190 74V650"/><path d="M275 110V190M1000 520V620"/></g>
  <g fill="none" stroke="#f4b8ad" stroke-width="6" filter="url(#glow)"><path d="M282 357H430"/><path d="M755 357H914"/><path d="M590 462V565H864"/></g>
  <g fill="none" stroke="#67d2cb" stroke-width="3" opacity=".8"><path d="M282 357H430"/><path d="M755 357H914"/><path d="M590 462V565H864"/></g>
  <g transform="translate(100 252)">
    <path d="M0 72 93 18 186 72 93 126Z" fill="#397d96"/><path d="M0 72v125l93 54V126Z" fill="#23536e"/><path d="M186 72v125l-93 54V126Z" fill="#2c6680"/>
    <rect x="35" y="85" width="118" height="78" rx="10" fill="#1f1b1a" stroke="#f4b8ad"/><text x="94" y="119" text-anchor="middle" fill="#faf8f7" font-family="Arial, sans-serif" font-size="24" font-weight="700">SQL</text><text x="94" y="147" text-anchor="middle" fill="#d6d3d1" font-family="Arial, sans-serif" font-size="16">operation</text>
  </g>
  <g transform="translate(432 156)">
    <path d="M0 118 156 28 312 118 156 208Z" fill="#e26852" opacity=".95"/><path d="M0 118v205l156 90V208Z" fill="#8d3028"/><path d="M312 118v205l-156 90V208Z" fill="#b54235"/>
    <g fill="#f4b8ad" opacity=".75"><rect x="70" y="145" width="172" height="30" rx="8"/><rect x="70" y="194" width="172" height="30" rx="8"/><rect x="70" y="243" width="172" height="30" rx="8"/></g>
    <text x="156" y="90" text-anchor="middle" fill="#faf8f7" font-family="Arial, sans-serif" font-size="28" font-weight="700">PGA</text><text x="156" y="121" text-anchor="middle" fill="#f4b8ad" font-family="Arial, sans-serif" font-size="18">WORK AREA</text>
  </g>
  <g transform="translate(865 450)">
    <ellipse cx="98" cy="38" rx="98" ry="36" fill="#d9a441"/><path d="M0 38v134c0 20 44 36 98 36s98-16 98-36V38" fill="#81511e"/><ellipse cx="98" cy="172" rx="98" ry="36" fill="#9a6828"/>
    <path d="M0 85c0 20 44 36 98 36s98-16 98-36M0 132c0 20 44 36 98 36s98-16 98-36" fill="none" stroke="#f4d08b" stroke-width="3"/>
    <text x="98" y="48" text-anchor="middle" fill="#1f1b1a" font-family="Arial, sans-serif" font-size="23" font-weight="700">TEMP</text><text x="98" y="76" text-anchor="middle" fill="#fff2cf" font-family="Arial, sans-serif" font-size="14">conceptual</text>
  </g>
  <g transform="translate(940 252)">
    <path d="M0 72 93 18 186 72 93 126Z" fill="#62a99e"/><path d="M0 72v125l93 54V126Z" fill="#2e7169"/><path d="M186 72v125l-93 54V126Z" fill="#3f887e"/>
    <path d="M57 123h72v58H57z" fill="#1f1b1a" stroke="#f4b8ad"/><path d="M71 149h44" stroke="#67d2cb" stroke-width="5"/>
