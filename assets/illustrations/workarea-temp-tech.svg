  </g>
  <g fill="#f4b8ad" filter="url(#glow)"><circle cx="320" cy="357" r="10"/><circle cx="803" cy="357" r="10"/><circle cx="864" cy="565" r="10"/></g>
  <text x="640" y="670" text-anchor="middle" fill="#d6d3d1" font-family="Arial, sans-serif" font-size="16">Flujo educativo: SQL → workarea → TEMP solo si el timeline lo declara → resultado</text>
</svg>
