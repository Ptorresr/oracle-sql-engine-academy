<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Performance What-If: comparación educativa de dos hipótesis</title>
  <desc id="desc">Dos rutas comparan entradas declaradas, Buffer Cache conceptual, Workarea, TEMP condicional y resultados lógicos sin representar una ejecución física de Oracle Database.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#09111f"/><stop offset="1" stop-color="#162239"/></linearGradient>
    <linearGradient id="panel" x1="0" x2="1"><stop stop-color="#163f60"/><stop offset="1" stop-color="#0c1d32"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g opacity=".28" stroke="#5ee6ff" stroke-width="2"><path d="M0 110H250V190H420"/><path d="M0 610H280V540H420"/><path d="M820 190H1010V110H1280"/><path d="M820 540H1010V610H1280"/></g>
  <g fill="url(#panel)" stroke="#65ddff" stroke-width="3"><path d="M80 155l150-84 150 84-150 84z"/><path d="M80 155v190l150 84 150-84V155l-150 84z"/><path d="M475 235l145-82 145 82-145 82z"/><path d="M475 235v176l145 82 145-82V235l-145 82z"/><path d="M885 155l150-84 150 84-150 84z"/><path d="M885 155v190l150 84 150-84V155l-150 84z"/></g>
  <g fill="#eff8ff" font-family="Arial, sans-serif" text-anchor="middle"><text x="230" y="250" font-size="31" font-weight="700">ENTRADAS</text><text x="230" y="286" font-size="20">A / B declaradas</text><text x="620" y="318" font-size="29" font-weight="700">MEMORY</text><text x="620" y="350" font-size="20">Cache · Workarea</text><text x="1035" y="250" font-size="31" font-weight="700">RESULTS</text><text x="1035" y="286" font-size="20">lógicos declarados</text></g>
  <g fill="none" stroke="#44d8ef" stroke-width="9" filter="url(#glow)"><path d="M382 250H468"/><path d="M770 320H875"/></g>
  <g fill="#e7533c" filter="url(#glow)"><circle cx="424" cy="250" r="10"/><circle cx="823" cy="320" r="10"/></g>
  <g transform="translate(548 488)"><path d="M0 0h144l34 34v91l-34 34H0l-34-34V34z" fill="#4b2944" stroke="#e2a7de" stroke-width="3"/><text x="72" y="75" text-anchor="middle" fill="#fff2ff" font-family="Arial, sans-serif" font-size="25" font-weight="700">TEMP</text><text x="72" y="106" text-anchor="middle" fill="#fff2ff" font-family="Arial, sans-serif" font-size="16">solo condicional</text></g>
  <path d="M620 415V482" stroke="#e2a7de" stroke-width="6" stroke-dasharray="12 10"/>
  <text x="640" y="665" text-anchor="middle" fill="#b9cee5" font-family="Arial, sans-serif" font-size="20">Ilustración local: rutas conceptuales, no una traza física, temporal ni de coste.</text>
</svg>
