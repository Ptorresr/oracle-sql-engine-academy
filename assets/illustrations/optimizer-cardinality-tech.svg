    <text x="208" y="331" font-size="24" font-weight="700">STATS</text><text x="208" y="365" font-size="18">DECLARED</text>
    <text x="529" y="287" font-size="24" font-weight="700">ESTIMATE</text><text x="529" y="321" font-size="18">CARDINALITY</text>
    <text x="869" y="331" font-size="24" font-weight="700">ACCESS</text><text x="869" y="365" font-size="18">ALTERNATIVES</text>
