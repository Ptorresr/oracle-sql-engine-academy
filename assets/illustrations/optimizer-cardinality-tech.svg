    <path d="M86 289l122-71 122 71v143l-122 71-122-71z"/><path d="M397 239l132-76 132 76v154l-132 76-132-76z"/><path d="M747 289l122-71 122 71v143l-122 71-122-71z"/><path d="M1081 289l88-51 88 51v143l-88 51-88-51z"/>
  </g>
