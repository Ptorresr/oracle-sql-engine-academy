    <linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#44c7dc"/><stop offset="1" stop-color="#2786c8"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g opacity=".2" stroke="#55d7e8"><path d="M0 610H1280M0 490H1280M0 370H1280M0 250H1280"/><path d="M120 720V0M300 720V0M480 720V0M660 720V0M840 720V0M1020 720V0M1200 720V0"/></g>
