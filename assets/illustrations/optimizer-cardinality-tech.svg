<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Optimizer y Cardinality educativo</title>
  <desc id="desc">Una composición tridimensional muestra estadísticas declaradas, un estimador de cardinalidad, alternativas de acceso y una salida lógica iluminada.</desc>
